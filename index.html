<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga de Stock y Compras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass {
      background: rgba(15, 23, 42, 0.70);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 selection:bg-cyan-500 selection:text-black">

  <!-- Header -->
  <header class="border-b border-slate-800/80 glass sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-violet-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-cyan-500/20">S</div>
        <div>
          <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-cyan-400 to-violet-400 bg-clip-text text-transparent">Gestión de Stock</h1>
          <p class="text-xs text-slate-400">Carga e Historial de Compras</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

    <!-- Formulario de Carga de Stock -->
    <section class="glass rounded-2xl p-6">
      <h2 class="text-base font-semibold mb-4 text-white flex items-center gap-2">
        <span>+</span> Registrar Nueva Compra de Stock
      </h2>

      <form id="stock-form" onsubmit="addPurchase(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Fecha de Compra</label>
            <input type="date" id="date" required class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition-all">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Producto</label>
            <input type="text" id="product" placeholder="Ej: Packs de Agua 1.5L" required class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition-all">
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Pallets</label>
            <input type="number" id="pallets" min="0" value="0" placeholder="0" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Packs Sueltos</label>
            <input type="number" id="loose-packs" min="0" value="0" placeholder="0" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Costo Total ($)</label>
            <input type="number" step="0.01" id="total-cost" placeholder="Ej: 150000" required oninput="calculateUnitCost()" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Costo x Pack ($)</label>
            <input type="number" step="0.01" id="cost-per-pack" placeholder="Ej: 2500" required class="w-full bg-slate-900/80 border border-slate-700/80 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-cyan-500">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full mt-4 py-3 bg-gradient-to-r from-cyan-500 to-violet-600 rounded-xl font-semibold text-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-cyan-500/25">
          Guardar Compra
        </button>
      </form>
    </section>

    <!-- Tabla Historial de Compras -->
    <section class="glass rounded-2xl p-6 overflow-hidden">
      <h2 class="text-base font-semibold text-slate-300 mb-4">Historial de Compras</h2>
      <div class="overflow-x-auto max-h-96 overflow-y-auto">
        <table class="w-full text-left text-xs">
          <thead class="text-slate-400 uppercase border-b border-slate-800 sticky top-0 bg-slate-950/90 backdrop-blur-md">
            <tr>
              <th class="pb-3 px-2">Fecha</th>
              <th class="pb-3 px-2">Producto</th>
              <th class="pb-3 px-2">Cantidad (Pallets / Packs)</th>
              <th class="pb-3 px-2 text-right">Costo Total</th>
              <th class="pb-3 px-2 text-right">Costo x Pack</th>
              <th class="pb-3 px-2 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="purchases-list" class="divide-y divide-slate-800/50">
            <tr>
              <td colspan="6" class="py-6 text-center text-slate-500">Cargando historial...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://rydmmhiqsnvbbhklzyfb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_N2gBPvn7Msh-TN49QkuxTQ_qendCCbC';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let purchases = [];

    document.getElementById('date').valueAsDate = new Date();

    async function loadPurchases() {
      const { data, error } = await db
        .from('stock_purchases')
        .select('*')
        .order('date', { ascending: false });

      if (error) {
        console.error('Error cargando historial de compras:', error);
        document.getElementById('purchases-list').innerHTML = `
          <tr><td colspan="6" class="py-6 text-center text-red-400">Error al cargar datos de Supabase.</td></tr>
        `;
        return;
      }

      purchases = data || [];
      renderPurchasesTable();
    }

    function renderPurchasesTable() {
      const tbody = document.getElementById('purchases-list');
      tbody.innerHTML = '';

      if (purchases.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-6 text-center text-slate-500">No hay compras registradas aún.</td></tr>`;
        return;
      }

      purchases.forEach(p => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-900/50 transition-colors";

        const palletsText = p.pallets > 0 ? `${p.pallets} pallet(s)` : '';
        const looseText = p.loose_packs > 0 ? `${p.loose_packs} pack(s) sueltos` : '';
        const quantityDisplay = [palletsText, looseText].filter(Boolean).join(' + ') || '0 packs';

        tr.innerHTML = `
          <td class="py-3 px-2 text-slate-400">${p.date}</td>
          <td class="py-3 px-2 font-semibold text-white">${p.product}</td>
          <td class="py-3 px-2 text-cyan-400">${quantityDisplay}</td>
          <td class="py-3 px-2 text-right font-bold text-emerald-400">$${parseFloat(p.total_cost).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
          <td class="py-3 px-2 text-right text-violet-400">$${parseFloat(p.cost_per_pack).toLocaleString('es-AR', {minimumFractionDigits: 2})}</td>
          <td class="py-3 px-2 text-center">
            <button onclick="deletePurchase(${p.id})" class="text-slate-500 hover:text-red-400 transition-colors">✕</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function addPurchase(e) {
      e.preventDefault();

      const newPurchase = {
        date: document.getElementById('date').value,
        product: document.getElementById('product').value,
        pallets: parseInt(document.getElementById('pallets').value) || 0,
        loose_packs: parseInt(document.getElementById('loose-packs').value) || 0,
        total_cost: parseFloat(document.getElementById('total-cost').value) || 0,
        cost_per_pack: parseFloat(document.getElementById('cost-per-pack').value) || 0
      };

      const { data, error } = await db
        .from('stock_purchases')
        .insert([newPurchase])
        .select();

      if (error) {
        alert('Error al guardar la compra: ' + error.message);
        return;
      }

      purchases.unshift(data[0]);
      renderPurchasesTable();
      document.getElementById('stock-form').reset();
      document.getElementById('date').valueAsDate = new Date();
    }

    async function deletePurchase(id) {
      if (!confirm('¿Querés eliminar este registro de compra?')) return;

      const { error } = await db.from('stock_purchases').delete().eq('id', id);
      if (error) {
        alert('Error al eliminar: ' + error.message);
        return;
      }

      purchases = purchases.filter(p => p.id !== id);
      renderPurchasesTable();
    }

    loadPurchases();
  </script>
</body>
</html>
